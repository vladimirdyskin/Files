# --- Макросы prtouch временно убраны ---------------------------------------
# Z_OFFSET / SIMPLE_Z_OFFSET / AUTO_Z_OFFSET вызывали PRTOUCH_PROBE_ZOFFSET,
# которой больше нет: [include prtouch.cfg] отключён в printer.cfg ради
# штатного [load_cell]. Оригиналы — в macro.cfg.bak-preloadcell.
# Текущий z_offset BLTouch (2.59) сохранён и работает; выставить его вручную
# можно командой PROBE_CALIBRATE.
# ---------------------------------------------------------------------------


[gcode_macro PID_EXTRUDER]
gcode:
  PID_CALIBRATE HEATER=extruder TARGET=230
  SAVE_CONFIG

[gcode_macro PID_BED]
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET=90
  SAVE_CONFIG

[gcode_macro NOTHING]
description: End of printing
gcode:
    M118 SDCard error ; error

[gcode_macro START_PRINT]          # START_PRINT 
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    SET_LED LED=my_led WHITE=0.2    
    M104 S200;
    M140 S{BED_TEMP}
    G92 E0 ; Reset Extruder
    G28 ; Home all axes
    G90 ; Absolute Coords
    # Wait for bed to reach temperature
    M190 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP};
    
    BED_MESH_CLEAR

    # Z-offset (ноль сопла) уже выставлен КАСАНИЕМ соплом в G28 выше — щуп теперь
    # тензодатчик [load_cell_probe]. Меш этим щупом НЕ снимаем (край ненадёжен),
    # поэтому грузим статический профиль, снятый BLTouch. Пересъёмка меша — через
    # временный возврат BLTouch (см. комментарии в printer.cfg) + CALIBRATE_BED.
    BED_MESH_PROFILE LOAD=default

    M109 S{EXTRUDER_TEMP}
    M107 ; Part fan off for the first layer
    SKEW_PROFILE LOAD=CaliFlower
    G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X12 Y20 Z0.3 F5000.0 ; Move to start position
    G1 X12 Y200.0 Z0.3 F1500.0 E15 ; Draw the first line
    G1 X15 Y200.0 Z0.3 F5000.0 ; Move to side a little
    G1 X15 Y20 Z0.3 F1500.0 E30 ; Draw the second line
    G92 E0 ; Reset Extruder
    G1 Z2.0 F3000 ; Move Z Axis up little to prevent scratching of Heat Bed
    G1 X20 Y20 Z0.3 F5000.0 ; Move over to prevent blob squish
    
[gcode_macro FILAMENT_LOAD]
gcode:
    {% set load = params.L|default(100)|float * 0.5 %}
    {% set extruder_temp = params.T|default(210)|float %}
    SAVE_GCODE_STATE NAME=FILAMENT_LOAD_STATE
    LOW_TEMP_CHECK T={extruder_temp}
    M118 Loading filament
    M83                                                                         # relative extrusion
    G1 E{load} F1500                                                            # extrude fast
    G4 P1000                                                                    # wait 1 second
    G1 E{load} F200                                                             # extrude slow
    RESTORE_GCODE_STATE NAME=FILAMENT_LOAD_STATE
    BEEP


[gcode_macro FILAMENT_UNLOAD]
gcode:
    {% set unload = params.U|default(100)|float %}
    {% set extruder_temp = params.T|default(200)|float %}
    SAVE_GCODE_STATE NAME=FILAMENT_UNLOAD_STATE
    LOW_TEMP_CHECK T={extruder_temp}
    M118 Unloading filament
    M83                                                                         # relative extrusion
    G1 E2  F200                                                                 # extrude a little
    G1 E-10  F200                                                               # retract a little
    G1 E-{unload} F1500                                                         # retract a lot
    RESTORE_GCODE_STATE NAME=FILAMENT_UNLOAD_STATE

[gcode_macro LOW_TEMP_CHECK]
gcode:
    {% set extruder_temp = params.T|default(200)|float %}
    {% if printer.extruder.target > extruder_temp %}                            # if there is a setpoint for extruder
        {% set extruder_temp = printer.extruder.target %}
    {% endif %}
    {% if printer.extruder.temperature < extruder_temp %}                       # heat to the target
        M118 Heating to {extruder_temp}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
    {% endif %}

[gcode_macro BEEP]
gcode:
    {% set duration = params.P|default(100)|float %}
    SET_PIN PIN=beeper VALUE=1
    G4 P{duration}
    SET_PIN PIN=beeper VALUE=0


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
variable_machine_depth: 220
gcode:
  SET_SKEW CLEAR=1
  ##### get user parameters or use default #####
  {% set client = printer['gcode_macro _CLIENT_VARIABLE'] | default({}) %}
  {% set allow_park = client.park_at_cancel | default(false) | lower == 'true' %}
  {% set retract = client.cancel_retract | default(5.0) | abs %}
  ##### define park position #####
  {% set park_x = "" if (client.park_at_cancel_x | default(none) is none)
            else "X=" ~ client.park_at_cancel_x %}
  {% set park_y = "" if (client.park_at_cancel_y | default(none) is none)
            else "Y=" ~ client.park_at_cancel_y %}
  {% set custom_park = park_x | length > 0 or park_y | length > 0 %}
  ##### end of definitions #####
  # restore idle_timeout time if needed
  # restore_idle_timeout живёт в RESUME (так его хранит fluidd.cfg), не в PAUSE.
  {% if printer['gcode_macro RESUME'].restore_idle_timeout > 0 %}
    SET_IDLE_TIMEOUT TIMEOUT={printer['gcode_macro RESUME'].restore_idle_timeout}
  {% endif %}
  {% if (custom_park or not printer.pause_resume.is_paused) and allow_park %} _TOOLHEAD_PARK_PAUSE_CANCEL {park_x} {park_y} {% endif %}
  _CLIENT_RETRACT LENGTH={retract}
  # Нагрев гасим ДО перемещений (см. тот же комментарий в END_PRINT).
  M106 S0 ;Turn-off part fan
  TURN_OFF_HEATERS
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set act    = printer.gcode_move.gcode_position %}
    {% set max    = printer.toolhead.axis_maximum %}
    {% set z_park = [act.z + 50.0, max.z - origin.z] | min %}
    G90 ;Absolute positioning
    G1 Z{z_park} F1500 ;Raise Z (clamped)
    G1 X0 Y{machine_depth} F3000 ;Present print
  {% endif %}
  M84 X Y E ;Disable all steppers but Z
  # clear pause_next_layer and pause_at_layer as preparation for next print
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  CANCEL_PRINT_BASE

# --- PAUSE / RESUME / SET_PAUSE_* / SET_PRINT_STATS_INFO /
# --- _TOOLHEAD_PARK_PAUSE_CANCEL / _CLIENT_EXTRUDE / _CLIENT_RETRACT
# These used to be copy-pasted here. They are provided (and kept up to date)
# by [include fluidd.cfg] -> ~/fluidd-config/fluidd.cfg. Do not re-add them.
# Tune their behaviour via [gcode_macro _CLIENT_VARIABLE] in printer.cfg.

[gcode_macro END_PRINT]
description: End of printing
variable_machine_depth: 220
gcode:
      SET_SKEW CLEAR=1
      # Нагрев гасим ДО перемещений: если движение упрётся в лимит оси,
      # ошибка оборвёт макрос — и нагреватели останутся включёнными.
      M106 S0 ;Turn-off part fan
      TURN_OFF_HEATERS
      {% if "xyz" in printer.toolhead.homed_axes %}
        {% set origin = printer.gcode_move.homing_origin %}
        {% set act    = printer.gcode_move.gcode_position %}
        {% set max    = printer.toolhead.axis_maximum %}
        # Подъём на 50 мм, но не выше position_max (с учётом gcode-офсета).
        {% set z_park = [act.z + 50.0, max.z - origin.z] | min %}
        {% if printer.extruder.can_extrude %}
          # M83 явно: G91 задаёт только оси, режим E им не меняется,
          # поэтому при активном M82 "G1 E-4" уехал бы в абсолютный -4.
          M83 ;Relative extrusion
          G1 E-4 F2700 ;Retract
        {% endif %}
        G90 ;Absolute positioning
        G1 Z{z_park} F1500 ;Raise Z (clamped)
        G1 X0 Y{machine_depth} F3000 ;Present print
      {% else %}
        RESPOND TYPE=echo MSG='END_PRINT: оси не хоумлены, перемещения пропущены'
      {% endif %}
      M84 X Y E ;Disable all steppers but Z
      # BEEP
      # SET_LED LED=my_led WHITE=0.0    
 #     UPDATE_DELAYED_GCODE ID=DELAYED_PRINTER_OFF DURATION=60
 #     WLED_ON STRIP=roof PRESET=4

[gcode_macro BLTOUCH_UP]
gcode:
  BLTOUCH_DEBUG COMMAND=pin_up 
[gcode_macro BLTOUCH_DOWN]
gcode:
  BLTOUCH_DEBUG COMMAND=pin_down 

[gcode_macro BLTOUCH_RESET]
gcode:
  BLTOUCH_DEBUG COMMAND=reset 
[gcode_macro CALIBRATE_BED]
description: Меш стола по прогретому. Параметры: BED=60 EXTRUDER=150 SOAK=5 PROFILE=default SAVE=0
gcode:
    {% set BED      = params.BED|default(60)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(150)|float %}
    {% set SOAK     = params.SOAK|default(5)|int %}
    {% set PROFILE  = params.PROFILE|default('default') %}
    {% set SAVE     = params.SAVE|default(0)|int %}

    {% if printer.print_stats.state == "printing" %}
      { action_raise_error("CALIBRATE_BED: идёт печать") }
    {% endif %}

    RESPOND TYPE=echo MSG='CALIBRATE_BED: стол {BED}C, сопло {EXTRUDER}C, выдержка {SOAK} мин, профиль "{PROFILE}"'

    # Перекос и старый меш исказили бы замер — гасим оба.
    SET_SKEW CLEAR=1
    BED_MESH_CLEAR

    # Сопло греем до 150C: горячий хотэнд удлиняется, и замерять надо в том же
    # тепловом состоянии, в котором печатаем. Выше 150 начинает течь и капать на стол.
    M140 S{BED}
    M104 S{EXTRUDER}
    M190 S{BED}
    M109 S{EXTRUDER}

    G28

    # Стол ведёт ещё несколько минут после выхода на температуру.
    # Без выдержки меш снимается с недогретой плиты и врёт на десятые доли.
    {% if SOAK > 0 %}
      RESPOND TYPE=echo MSG='Выдержка {SOAK} мин — стол стабилизируется...'
      G4 P{SOAK * 60000}
      G28 Z                    # за время прогрева ноль мог уплыть
    {% endif %}

    RESPOND TYPE=echo MSG='Замер {printer.configfile.settings.bed_mesh.probe_count[0]}x{printer.configfile.settings.bed_mesh.probe_count[1]} точек...'
    BED_MESH_CALIBRATE PROFILE={PROFILE}

    G1 Z10 F600
    {% if SAVE %}
      RESPOND TYPE=echo MSG='Сохраняю профиль "{PROFILE}" — Klipper перезапустится'
      SAVE_CONFIG
    {% else %}
      RESPOND TYPE=echo MSG='Меш снят. Для сохранения выполни SAVE_CONFIG'
    {% endif %}
