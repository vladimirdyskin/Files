[include fluidd.cfg]

[include macro.cfg]

# [include prtouch.cfg]
# Форковый prtouch отключён: его [hx711s] занимал те же пины PA4/PC6, что нужны
# штатному [load_cell] ниже, и Klipper ругался бы "pin used multiple times".
# Оригинал сохранён как prtouch.cfg.keep — вернуть можно, раскомментировав строку
# выше и убрав [load_cell]. Вместе с ним временно недоступны макросы
# Z_OFFSET / SIMPLE_Z_OFFSET / AUTO_Z_OFFSET (см. macro.cfg).

# Штатный тензодатчик Klipper как ОСНОВНОЙ щуп по Z: касается сам нозл.
# Z-offset (ноль сопла) выставляется КАСАНИЕМ соплом при каждом G28 — это тот
# самый авто-Z, что был на prtouch. МЕШ этим щупом НЕ снимаем: чувствительность
# падает от датчика (он под передне-левым углом ~32,30), дальний/правый край
# ненадёжен. Меш берём статический от BLTouch (профиль default, грузится в
# START_PRINT). Прошивка сравнивает МОДУЛЬ силы (src/trigger_analog.c, "abs_ge"),
# поэтому разный знак отклика в точках не мешает.
# counts_per_gram / reference_tare_counts / z_offset лежат в блоке SAVE_CONFIG.
# Двух probe одновременно быть не может: [bltouch] ниже закомментирован
# (add_object('probe') один — bltouch.py:305 vs load_cell_probe.py:518).
[load_cell_probe]
sensor_type: hx711
sclk_pin: PA4          # было sensor0_clk_pin в prtouch.cfg
dout_pin: PC6          # было sensor0_sdo_pin
sample_rate: 80        # железо тикает 12.5 мс (src/hx711s.c: CLOCK_FREQ/10000*125)
#gain: A-128           # дефолт; для HX711 это МАКСИМУМ

trigger_force: 35      # г. Порог касания. При шуме ±2 г запас 17x
force_safety_limit: 2000   # г. Превышение -> аварийный стоп "too much force"

# Сопло И ЕСТЬ щуп -> x_offset/y_offset = 0 (дефолт, не задаём).
speed: 2               # мм/с. Медленно: перерегулирование растёт со скоростью
lift_speed: 5
samples: 2
sample_retract_dist: 2
samples_tolerance: 0.05
samples_tolerance_retries: 3

#[include adxl.cfg]
[exclude_object]

# NOTE: [display_status], [respond], [pause_resume] and [virtual_sdcard] are all
# defined by fluidd.cfg (included first). Only the deliberate overrides are kept
# here -- Klipper parses with strict=False, so the last definition wins.
[pause_resume]
recover_velocity: 25          # override: fluidd default is 50

[skew_correction]

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: NOTHING       # override: fluidd default is CANCEL_PRINT

# Tunes the fluidd PAUSE / RESUME / CANCEL_PRINT macros.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 10.0
variable_custom_park_y    : 210.0
variable_custom_park_dz   : 2.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 100.0
variable_park_at_cancel   : False
gcode:

[stepper_x]
step_pin: PC2
dir_pin: !PB9
enable_pin: !PC3
microsteps: 32   # было 64: при interpolate=True драйвер всё равно сглаживает до 256, разницы нет
# rotation_distance: 40 #нове значення rotation_distance = rotation_distance*фактичний розмір/очікуваний розмір xyz куба
rotation_distance: 39.88
endstop_pin: !PA5
position_endstop: -6
position_min: -6
position_max: 230
homing_speed: 80
[tmc2209 stepper_x]
uart_pin: PB12
run_current: 0.60
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_y]
step_pin: PB8
dir_pin: PB7
enable_pin: !PC3
microsteps: 32   # было 64: при interpolate=True драйвер всё равно сглаживает до 256, разницы нет
# rotation_distance: 40 #нове значення rotation_distance = rotation_distance*фактичний розмір/очікуваний розмір xyz куба
rotation_distance: 39.89
endstop_pin: !PA6
position_endstop: -14
position_min: -14
position_max: 230
homing_speed: 80
[tmc2209 stepper_y]
uart_pin: PB13
run_current: 0.60
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[stepper_z]
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -3
position_max: 250
homing_speed: 4
second_homing_speed: 1
homing_retract_dist: 2.0
[tmc2209 stepper_z]
uart_pin: PB14
run_current: 0.8
sense_resistor: 0.150
stealthchop_threshold: 0
interpolate: True

[extruder]
max_extrude_only_distance: 100.0
pressure_advance: 0.05
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
# rotation_distance: 7.45 #my prev 
rotation_distance: 7.67 #extruder calibrate
# На філаменті ставимо мітку маркером на відстані 70 мм від екструдера, виконуємо команди "G91" та "G1 E50 F60",
# потім міряємо відстань до мітки, якщо рівно 20 мм - це перемога, якщо ні використовуємо формулу нового значення 
# rotation_distance = поточне значення rotation_distance * (70 - ваша відстань до мітки)/50
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PA1
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
#control: pid
#pid_Kp: 29.248
#pid_Ki: 1.652
#pid_Kd: 129.423
min_temp: 5      # было 0: при 0 обрыв/КЗ термистора не вызывал ошибку
max_temp: 270

[heater_bed]
heater_pin: PB2
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
#control: pid
#pid_kp: 66.978
#pid_ki: 0.807
#pid_kd: 1388.948

min_temp: 5      # было 0: при 0 обрыв/КЗ термистора не вызывал ошибку
max_temp: 105

[heater_fan hotend_fan]
pin: PC1
max_power: 1.0
shutdown_speed : 0
cycle_time: 0.010
hardware_pwm: false
kick_start_time: 0.100
off_below: 0.0
heater:extruder
heater_temp : 50
fan_speed : 1.0

[fan]
pin: PA0
kick_start_time: 0.100
off_below: 0.10

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0 #ls /dev/serial/by-id/*
# serial: /dev/serial/by-path/platform-3f980000.usb-usb-0\:1.5\:1.0-port0
restart_method: command

[printer]
kinematics: cartesian
max_velocity: 150
max_accel: 3000
#max_accel_to_decel: 3000
max_z_velocity: 5
square_corner_velocity: 5.0
max_z_accel: 500

[bltouch]
sensor_pin: ^PC14
control_pin: PC13
# x_offset: -22.7
# y_offset: -16.5
#z_offset: 2.28
x_offset: -40.24
y_offset: -12.25

speed: 20
samples: 2
samples_tolerance_retries: 4
pin_move_time: 0.4
stow_on_each_sample: False
probe_with_touch_mode: True

[safe_z_home]
home_xy_position: 139, 127
speed: 60
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 150
horizontal_move_z: 5
# ВАЖНО: mesh_min/mesh_max задаются в координатах ЩУПА, не сопла.
# Klipper двигает голову так: сопло = mesh_точка - probe_offset, т.е. при
# x_offset=-40.24 / y_offset=-12.25:  сопло_X = mesh_X + 40.24, сопло_Y = mesh_Y + 12.25
# Отсюда жёсткие пределы (position_max 230/230, position_min -6/-14):
#   mesh_max X <= 230 - 40.24 = 189.76
#   mesh_max Y <= 230 - 12.25 = 217.75
# Ниже взят запас ~3 мм. Правый край стола X>189.76 щупом недостижим — там меш экстраполируется.
mesh_min: 5,5          # сопло уедет в 45.24, 17.25
mesh_max: 187,214      # сопло уедет в 227.24, 226.25 — в пределах 230
probe_count: 7,7       # was 20,20 = 400 probes (~10 min). Saved profiles keep their own grid.
# probe_count: 20,20   # uncomment for a one-off high-resolution mesh

algorithm: bicubic
mesh_pps: 2, 3
fade_start: 1
fade_end: 10
fade_target: 0
bicubic_tension: 0.2

# [display]
# NOT IMPLEMTED (assuming it even works)

[output_pin beeper]
pin: PB0


[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100

[temperature_sensor Raspberry]
sensor_type: temperature_host
min_temp: 10
max_temp: 100

[led my_led]
white_pin: PC15
#   The pin controlling the given LED color. At least one of the above
#   parameters must be provided.
cycle_time: 0.001
#   The amount of time (in seconds) per PWM cycle. It is recommended
#   this be 10 milliseconds or greater when using software based PWM.
#   The default is 0.010 seconds.
# hardware_pwm: True
initial_white: 0.3
#   Sets the initial LED color. Each value should be between 0.0 and
#   1.0. The default for each color is 0.

